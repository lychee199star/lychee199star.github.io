    <!-- 猫村留声机：与首页共用 music-player.js，从任何页面跳过来都接着上一首继续播。 -->
    <section class="music-player music-player--mini music-player--wood" id="music-player" aria-label="猫村留声机">
      <div class="music-player__header">
        <div class="music-player__eyebrow">♫ PALICO GRAMOPHONE</div>
        <button class="music-player__collapse" id="music-collapse" type="button" aria-label="收起音乐播放器" aria-expanded="true">−</button>
      </div>
      <div class="music-player__body">
        <div class="music-player__now-playing">
          <span class="music-player__disc" aria-hidden="true">♫</span>
          <div>
            <span class="music-player__label">正在播放</span>
            <strong id="music-title">英雄の証</strong>
            <span class="music-player__status" id="music-status" role="status">准备播放</span>
          </div>
        </div>
        <div class="music-player__controls" aria-label="播放控制">
          <button class="music-control" id="music-prev" type="button" aria-label="上一首">↶</button>
          <button class="music-control music-control--main" id="music-play" type="button" aria-label="播放">▶</button>
          <button class="music-control" id="music-next" type="button" aria-label="下一首">↷</button>
          <button class="music-control music-control--external" id="music-external" type="button" aria-label="在外部播放器打开当前歌曲" title="外接播放器">↗</button>
        </div>
        <div class="music-player__progress">
          <input class="music-player__slider music-player__seek" id="music-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="播放进度" aria-valuetext="0:00 / 0:00" />
          <div class="music-player__time"><span id="music-current">0:00</span><span id="music-duration">0:00</span></div>
        </div>
        <label class="music-player__volume">
          <span>音量</span>
          <input class="music-player__slider" id="music-volume" type="range" min="0" max="100" step="1" value="100" aria-label="音量" />
        </label>
      </div>
      <audio id="music-audio" preload="metadata"></audio>
    </section>

    <!-- 呆猫 Live2D 桌宠：与首页同一只呆猫，模型与渲染库均本地化 -->
    <script src="assets/live2d/lib/oh-my-live2d.min.js"></script>
    <script>
      if (window.OML2D) {
        window.__daimeow = window.OML2D.loadOml2d({
          models: [{ path: 'assets/live2d/daimeow/daimeow.model3.json' }],
          mobileDisplay: false,
          transitionTime: 1000,
          statusBar: { restMessage: '看板猫休息中' },
          menus: {
            items: [
              { id: 'Rest', icon: 'icon-rest', title: '休息', onClick: function (i) { var t; i.statusBarOpen((t = i.options.statusBar) == null ? void 0 : t.restMessage), i.clearTips(), i.setStatusBarClickEvent(function () { i.statusBarClose(), i.stageSlideIn(), i.statusBarClearEvents(); }), i.stageSlideOut(); } },
              { id: 'SwitchModelClothes', icon: 'icon-skin', title: '切换衣服', onClick: function (i) { i.loadNextModelClothes(); } },
              { id: 'SwitchModel', icon: 'icon-switch', title: '切换模型', onClick: function (i) { i.loadNextModel(); } }
            ]
          },
          tips: {
            idleTips: {
              message: [
                '别戳了喵，再戳就收费了喵！',
                '本喵在呢，找本喵干嘛喵？',
                '鼠标别晃啦，本喵眼都要转花了喵！',
                '听歌吗？这里放的音乐还不错的喵。',
                '老大，今天也要加油喵！'
              ],
              duration: 4000,
              interval: 15000
            },
            welcomeTips: {
              message: {
                daybreak: '早啊老大！新的一天也要元气满满喵！',
                morning: '上午好喵！本喵刚巡逻完村子喵。',
                noon: '中午啦，老大记得吃饭喵！',
                afternoon: '下午好喵，困了就摸摸本喵提神喵！',
                dusk: '天快黑了，老大今天过得怎么样喵？',
                night: '老大来啦喵！这么晚还在刷博客，早点睡喵！',
                lateNight: '夜深了喵，老大还醒着的话，本喵也陪着喵。',
                weeHours: '还不睡喵？本喵陪你一起熬夜喵……'
              },
              duration: 6000
            }
          }
        });
        document.addEventListener('click', function (event) {
          const stage = document.querySelector('#oml2d-stage');
          const instance = window.__daimeow;
          if (!stage || !instance) return;
          const rect = stage.getBoundingClientRect();
          const hitX = event.clientX >= rect.left && event.clientX <= rect.right;
          const hitY = event.clientY >= rect.top - 60 && event.clientY <= rect.bottom;
          if (hitX && hitY) {
            const lines = [
              '别戳了喵，再戳就收费了喵！',
              '本喵在呢，找本喵干嘛喵？',
              '鼠标别晃啦，本喵眼都要转花了喵！',
              '听歌吗？这里放的音乐还不错的喵。',
              '老大，今天也要加油喵！'
            ];
            instance.tipsMessage(lines[Math.floor(Math.random() * lines.length)], 3500, 3);
          }
        });
      }
    </script>
