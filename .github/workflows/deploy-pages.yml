name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: 收集要发布的站点文件
        run: |
          set -euo pipefail
          mkdir -p _site
          cp *.html *.css *.js .nojekyll _site/
          cp -r assets docs _site/
          # 绑定了自定义域名时，CNAME 必须一起发布，否则每次部署都会把域名冲掉
          if [ -f CNAME ]; then cp CNAME _site/; echo "已包含 CNAME: $(cat CNAME)"; fi
          echo "发布目录大小：$(du -sh _site | cut -f1)"
          echo "发布文件数：$(find _site -type f | wc -l)"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
